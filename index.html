<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #c{width:100%;max-width:100vw;image-rendering:pixelated;touch-action:none;cursor:crosshair;background:#88ccfe}
  #hud{position:fixed;top:8px;left:8px;color:#fff;font:12px/1.4 monospace;
       text-shadow:0 1px 2px #000;pointer-events:none;opacity:.85}
  #cross{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
         border:1px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
  .btn{position:fixed;bottom:16px;width:56px;height:56px;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font:22px/1 monospace;
       color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4);
       user-select:none;touch-action:none;z-index:2}
  #bd{right:88px;bottom:84px}#bp{right:16px;bottom:84px}
  #bj{right:88px;bottom:152px}#bi{right:16px;bottom:152px;z-index:6}
  #wrap{touch-action:none}
  #stk{position:fixed;width:104px;height:104px;border-radius:50%;display:none;z-index:3;
       border:2px solid rgba(255,255,255,.28);background:rgba(0,0,0,.22);pointer-events:none}
  #knb{position:absolute;width:36px;height:36px;border-radius:50%;
       background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.65)}
  #bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
       display:flex;gap:6px;z-index:2}
  .slot{width:42px;height:42px;border-radius:6px;border:2px solid rgba(255,255,255,.3);
        position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);cursor:pointer;touch-action:none}
  .slot.on{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
  .slot span{position:absolute;top:1px;left:4px;font:10px monospace;color:#fff;text-shadow:0 1px 1px #000}
  #clock{position:fixed;top:8px;right:10px;color:#fff;font:14px monospace;
         text-shadow:0 1px 2px #000;pointer-events:none;opacity:.9}
  .slot i{position:absolute;right:3px;bottom:0;font:11px/1.4 monospace;font-style:normal;
          color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
  .slot.e{background:rgba(255,255,255,.07)!important}
  #inv{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;
       align-items:center;justify-content:center;gap:12px;color:#fff;font:12px/1.6 monospace;
       background:rgba(8,10,14,.8);backdrop-filter:blur(3px)}
  #inv.on{display:flex}
  #invg{display:grid;grid-template-columns:repeat(6,46px);gap:5px;touch-action:none}
  #invg .slot{width:46px;height:46px}
  #invg .slot.hb{border-color:rgba(255,215,120,.75)}
  #invg .slot.src{opacity:.35}
  #ghost{position:fixed;width:46px;height:46px;border-radius:6px;pointer-events:none;
         z-index:9;display:none;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.6)}
  #craft button{font:12px monospace;color:#fff;background:rgba(255,255,255,.12);
       border:1px solid rgba(255,255,255,.45);border-radius:5px;padding:5px 12px;cursor:pointer}
  #craft button:disabled{opacity:.35;cursor:default}
  #invx{opacity:.6}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">WASD 移動 · 拖曳/點擊鎖定看視角 · 空白跳 · 左鍵/F 挖 · 右鍵/E 放<br>
手機:左半邊按住拖出搖桿 · 右半邊拖曳看視角 · ⤒跳 ⛏挖 ＋放 🎒背包<br>
選方塊:1–6 / 滾輪 / 點欄位 · I 或 Tab 開背包(拖曳搬移) · C 切換生存↔創造<br>
按住 T 快轉時間 · G 陰影開關 · 火把會發光,背包裡用木頭合成<br>
R 切換天氣(晴/雨/雪) · X 重置世界 · 世界自動存檔(下載後開啟才會保留)</div>
<div id="cross"></div>
<div id="clock">☀ 08:24</div>
<div id="bd" class="btn">⛏</div>
<div id="bp" class="btn">＋</div>
<div id="bj" class="btn">⤒</div>
<div id="bi" class="btn">🎒</div>
<div id="stk"><div id="knb"></div></div>
<div id="bar"></div>
<div id="inv">
  <div id="invt">背包 — 拖曳搬移方塊,第一排是快捷欄</div>
  <div id="invg"></div>
  <div id="craft">合成:木頭 ×1 → 火把 ×4 <button id="craftb">製作</button></div>
  <div id="invx">I / Tab / Esc 關閉 · C 切換生存↔創造</div>
</div>
<div id="ghost"></div>
<script>
M=Math,S=M.sin,C=M.cos,A=M.abs,mn=M.min,mx=M.max,
W=280,H=168,Z=32,hw=W/2,
D=new Uint32Array(W*H),
N=new ImageData(new Uint8ClampedArray(D.buffer),W,H),
w=new Uint8Array(32768),LG=new Uint8Array(32768),LQ=[],
P={x:16,y:20,z:16,a:0,b:0,g:0},
J=0,dc=0,tod=.35,SHD=1,SC=new Int8Array(196608),wthr=0,wt=0,sv=8,PT=[],K={},drag=0,
T=c.getContext('2d'),
I=(x,y,z)=>(y*32+z)*32+x,
B=(x,y,z)=>(x|y|z)&~31?0:w[I(x,y,z)];
c.width=W;c.height=H;

// ---- world generation ----
GEN=()=>{
  w.fill(0);
  for(i=1024;i--;){
    X=i%Z;Y=i>>5;
    h=12+4*S(X/4)*C(Y/4)|0;
    for(y=Z;y--;)w[I(X,y,Y)]=y<h+3?2:y<h?1:0;
    if(h<15&M.random()<.05){
      Th=4+(M.random()*2|0);
      for(k=Th;k--;)w[I(X,h+k,Y)]=3;                                   // trunk
      for(k=27;k--;)if(M.random()<.85)
        w[I(k%3+1+X,h+Th+2+(k/9|0),Y+(k/3|0)%3+1)]=4;                  // leaves
    }
  }
  for(x=0;x<32;x++)for(z=0;z<32;z++)if(x==0|x==31|z==0|z==31)          // glass boundary walls
    for(y=0;y<32;y++)if(!w[I(x,y,z)])w[I(x,y,z)]=5;
};
GEN();

// ---- torch light: BFS flood fill through air/glass, 1 level lost per block ----
LV=(x,y,z)=>(x|y|z)&~31?0:LG[I(x,y,z)];
LGT=()=>{
  LG.fill(0);LQ.length=0;
  for(li=0;li<32768;li++)if(w[li]==6){LG[li]=14;LQ.push(li);}   // torch = emitter
  for(lh=0;lh<LQ.length;lh++){
    li=LQ[lh];lv=LG[li]-1;if(lv<1)continue;
    lx=li&31;lz=li>>5&31;ly=li>>10;
    for(ld=6;ld--;){
      nx=lx+(ld==0)-(ld==1);ny=ly+(ld==2)-(ld==3);nz=lz+(ld==4)-(ld==5);
      if((nx|ny|nz)&~31)continue;
      ni=I(nx,ny,nz);bq=w[ni];
      if(bq&&bq!=5&&bq!=6)continue;                              // opaque blocks stop light
      if(LG[ni]>=lv)continue;
      LG[ni]=lv;LQ.push(ni);
    }
  }
};

// ---- inventory: 24 slots, the first 6 are the hotbar ----
KIT=()=>{INV=[];for(ki=0;ki<24;ki++)INV.push({id:0,n:0});INV[0]={id:2,n:16};INV[1]={id:6,n:8};};
KIT();

// ---- restore saved world (works when the file is opened directly; sandboxed previews may skip) ----
try{
  if(localStorage.voxelI){qi=JSON.parse(localStorage.voxelI);if(qi&&qi.length==24)INV=qi;}
  if(localStorage.voxelW){
    ss=atob(localStorage.voxelW);for(i=0;i<32768;i++)w[i]=ss.charCodeAt(i);
    pp=JSON.parse(localStorage.voxelP||'0');if(pp){P=pp;P.g=0;P.t=0;}
    if(localStorage.voxelT)tod=+localStorage.voxelT;
  }
}catch(e){}
LGT();

// ---- DDA voxel raycast ----
R=(p,d)=>{
  X=p.x|0;Y=p.y|0;Z=p.z|0;
  l=d.x;n=d.y;o=d.z;
  a=A(1/l);b=A(1/n);e=A(1/o);
  q=l>0?1:-1;r=n>0?1:-1;s=o>0?1:-1;
  u=(X+(l>0)-p.x)/l;
  v=(Y+(n>0)-p.y)/n;
  t=(Z+(o>0)-p.z)/o;
  gc=0;
  for(i=24;i--;){
    if(g=B(X,Y,Z)){
      if(g!=5)return{h:1,n:f,b:g,gc:gc};                 // opaque hit
      gc++;                                              // glass: tint & pass through
    }
    u<v?u<t?(u+=a,X+=q,f=0):(t+=e,Z+=s,f=2):v<t?(v+=b,Y+=r,f=1):(t+=e,Z+=s,f=2);
  }
  return{h:0,gc:gc};
};

// ---- AABB collision + gravity resolve ----
U=(ax,v)=>{
  r=.3;x0=P.x-r;x1=P.x+r;z0=P.z-r;z1=P.z+r;y0=P.y;y1=P.y+1.6;
  for(i=y0|0;i<=y1|0;i++)
   for(j=z0|0;j<=z1|0;j++)
    for(k=x0|0;k<=x1|0;k++)
     (bq=B(k,i,j))&&bq!=6&&x1>k&&x0<k+1&&y1>i&&y0<i+1&&z1>j&&z0<j+1&&
      (ax?ax-1?P.z=(v>0?j-r:j+1+r):(P.y=(v>0?i-1.6:i+1),P.g=0):(P.x=(v>0?k-r:k+1+r)));
};

// ---- targeting: raycast from eye through crosshair (reach = 7 blocks) ----
target=()=>{
  cp=C(P.b);sp=S(P.b);cx=C(P.a);sx=S(P.a);           // center ray = forward look dir
  px=P.x;py=P.y+1.5;pz=P.z;
  dxr=sx*cp;dyr=sp;dzr=cx*cp;
  gx=px|0;gy=py|0;gz=pz|0;
  stx=dxr>0?1:-1;sty=dyr>0?1:-1;stz=dzr>0?1:-1;
  tdx=A(1/dxr);tdy=A(1/dyr);tdz=A(1/dzr);
  tmx=(gx+(dxr>0)-px)/dxr;tmy=(gy+(dyr>0)-py)/dyr;tmz=(gz+(dzr>0)-pz)/dzr;
  ax=gx;ay=gy;az=gz;                                  // adjacent (empty) cell = previous step
  for(n2=7;n2--;){
    if((bl=B(gx,gy,gz))&&(bl!=5||gx&&gz&&gx!=31&&gz!=31))return[gx,gy,gz,ax,ay,az]; // glass diggable, cage isn't
    ax=gx;ay=gy;az=gz;
    tmx<tmy?tmx<tmz?(tmx+=tdx,gx+=stx):(tmz+=tdz,gz+=stz):tmy<tmz?(tmy+=tdy,gy+=sty):(tmz+=tdz,gz+=stz);
  }
  return 0;
};
dig=()=>{o=target();if(o){
  di=I(o[0],o[1],o[2]);bk=w[di];w[di]=0;LGT();
  if(!CRE)give(bk,1);                                 // survival: the block goes in the bag
}};
place=()=>{o=target();if(o){
  sel=CRE?PAL[selI]:INV[selI].id;
  if(!sel)return;                                     // empty hand
  ax=o[3];ay=o[4];az=o[5];
  if((ax|ay|az)&~31)return;                           // out of world
  if(B(ax,ay,az))return;                              // occupied
  if(sel!=6&ax+1>P.x-.3&ax<P.x+.3&az+1>P.z-.3&az<P.z+.3&ay+1>P.y&ay<P.y+1.6)return; // inside player
  w[I(ax,ay,az)]=sel;LGT();
  if(!CRE){if(!--INV[selI].n)INV[selI].id=0;drawBar();if(invOpen)drawInv();}
}};

// ---- project a world point to screen pixels (inverse of the ray map) ----
// camera orthonormal basis: F=(sx*cp,sp,cx*cp)  right=(cx,0,-sx)  up=(-sx*sp,cp,-cx*sp)
PR=(wx,wy,wz)=>{
  vx=wx-P.x;vy=wy-(P.y+1.5);vz=wz-P.z;
  fF=vx*sx*cp+vy*sp+vz*cx*cp;
  if(fF<=.05)return 0;                               // behind camera
  fR=vx*cx-vz*sx;
  fU=-vx*sx*sp+vy*cp-vz*cx*sp;
  return[(fR/fF+1)*hw,(.6-fU/fF)*hw];
};

// ---- shadow ray: from a point toward the sun, is the sky blocked? ----
SH=(px,py,pz)=>{
  gx=px|0;gy=py|0;gz=pz|0;
  Sx=sdx>0?1:-1;Sy=sdy>0?1:-1;Sz=sdz>0?1:-1;
  Tx=(gx+(sdx>0)-px)/sdx;Ty=(gy+(sdy>0)-py)/sdy;Tz=(gz+(sdz>0)-pz)/sdz;
  Dx=A(1/sdx);Dy=A(1/sdy);Dz=A(1/sdz);
  for(ns=16;ns--;){
    Tx<Ty?Tx<Tz?(Tx+=Dx,gx+=Sx):(Tz+=Dz,gz+=Sz):Ty<Tz?(Ty+=Dy,gy+=Sy):(Tz+=Dz,gz+=Sz);
    if((bl=B(gx,gy,gz))&&bl!=5)return 1;               // opaque block casts shadow
  }
  return 0;
};

// ---- input ----
bd=document.getElementById('bd');bp=document.getElementById('bp');clk=document.getElementById('clock');
bj=document.getElementById('bj');STK=document.getElementById('stk');KNB=document.getElementById('knb');
bd.ontouchstart=e=>{e.preventDefault();e.stopPropagation();dig();};
bp.ontouchstart=e=>{e.preventDefault();e.stopPropagation();place();};
bj.ontouchstart=e=>{e.preventDefault();e.stopPropagation();jmp=1;};
bd.onclick=()=>dig();bp.onclick=()=>place();bj.onclick=()=>jmp=1;

// ---- touch: left half = floating stick (relative to where you touched down),
//              right half = drag to look (delta based, same feel as the mouse) ----
mvId=-1;lkId=-1;mvu=0;mvv=0;lkx=0;lky=0;jmp=0;RAD=52;LKS=.0042;
Treset=()=>{mvId=lkId=-1;mvu=mvv=lkx=lky=0;STK.style.display='none';};
wrap.ontouchstart=e=>{e.preventDefault();
  for(tt of e.changedTouches){
    if(tt.clientX<innerWidth/2){
      if(mvId<0){                                   // stick springs up under the thumb
        mvId=tt.identifier;jx0=tt.clientX;jy0=tt.clientY;
        STK.style.display='block';STK.style.left=(jx0-RAD)+'px';STK.style.top=(jy0-RAD)+'px';
        KNB.style.left=KNB.style.top=(RAD-18)+'px';
      }
    }else if(lkId<0){lkId=tt.identifier;kx0=tt.clientX;ky0=tt.clientY;}
  }};
wrap.ontouchmove=e=>{e.preventDefault();
  for(tt of e.changedTouches){
    if(tt.identifier==mvId){
      ux=tt.clientX-jx0;uy=tt.clientY-jy0;ul=M.sqrt(ux*ux+uy*uy);
      if(ul>RAD){ux*=RAD/ul;uy*=RAD/ul;ul=RAD;}      // clamp to the ring
      KNB.style.left=(RAD-18+ux)+'px';KNB.style.top=(RAD-18+uy)+'px';
      mvu=ul<9?0:ux/RAD;mvv=ul<9?0:-uy/RAD;          // small dead zone; up = forward
    }else if(tt.identifier==lkId){
      lkx+=tt.clientX-kx0;lky+=tt.clientY-ky0;       // accumulate this frame's drag
      kx0=tt.clientX;ky0=tt.clientY;
    }
  }};
wrap.ontouchend=wrap.ontouchcancel=e=>{e.preventDefault();
  for(tt of e.changedTouches){
    if(tt.identifier==mvId){mvId=-1;mvu=mvv=0;STK.style.display='none';}
    if(tt.identifier==lkId)lkId=-1;
  }};

// ---- hotbar / inventory ----
BC=[0,'#F4D87E','#705030','#403020','#206020','#BFE6FF','#FFC24A'];  // colour by block id
BN=['','沙土','泥土','木頭','樹葉','玻璃','火把'];
PAL=[1,2,3,4,5,6];                                   // creative palette (infinite)
selI=0;CRE=0;invOpen=0;dragI=-1;
bar=document.getElementById('bar');ig=document.getElementById('invg');
ivp=document.getElementById('inv');gh=document.getElementById('ghost');
cbt=document.getElementById('craftb');ivt=document.getElementById('invt');bi=document.getElementById('bi');

CH=(it,i,num,onf)=>'<div class="slot'+(it.id?'':' e')+(num?' hb':'')+(onf?' on':'')+(i==dragI?' src':'')+
  '" data-i="'+i+'" title="'+(BN[it.id]||'')+'" style="background:'+(it.id?BC[it.id]:'')+'">'+
  (num?'<span>'+(i+1)+'</span>':'')+(it.id?'<i>'+(it.n<0?'∞':it.n)+'</i>':'')+'</div>';
drawBar=()=>{s2='';for(bj=0;bj<6;bj++)s2+=CH(CRE?{id:PAL[bj],n:-1}:INV[bj],bj,1,bj==selI);bar.innerHTML=s2;};
drawInv=()=>{s2='';for(bj=0;bj<24;bj++)s2+=CH(INV[bj],bj,bj<6,bj==selI);ig.innerHTML=s2;cbt.disabled=!has(3,1);
  ivt.textContent=CRE?'背包 — 創造模式中,快捷欄是無限方塊,背包內容原封不動':'背包 — 拖曳搬移方塊,第一排就是快捷欄';};
selBlock=v=>{selI=v;drawBar();if(invOpen)drawInv();};

// ---- stacking helpers (64 per stack) ----
give=(id,n)=>{
  if(!id)return;
  for(gi=0;gi<24;gi++)if(INV[gi].id==id&&INV[gi].n<64){kk=mn(64-INV[gi].n,n);INV[gi].n+=kk;n-=kk;if(!n)break;}
  if(n)for(gi=0;gi<24;gi++)if(!INV[gi].id){kk=mn(64,n);INV[gi]={id:id,n:kk};n-=kk;if(!n)break;}
  drawBar();if(invOpen)drawInv();                     // leftover when full is simply lost
};
has=(id,n)=>{c3=0;for(gi=0;gi<24;gi++)if(INV[gi].id==id)c3+=INV[gi].n;return c3>=n;};
take=(id,n)=>{if(!has(id,n))return 0;
  for(gi=0;gi<24&&n;gi++)if(INV[gi].id==id){kk=mn(INV[gi].n,n);INV[gi].n-=kk;n-=kk;if(!INV[gi].n)INV[gi].id=0;}
  return 1;};
cbt.onclick=()=>{if(take(3,1))give(6,4);};            // 1 wood -> 4 torches

// ---- open / close ----
tog=v=>{invOpen=v?1:0;ivp.classList.toggle('on',!!v);dragI=-1;gh.style.display='none';
  bar.style.display=invOpen?'none':'flex';            // first grid row already is the hotbar
  if(v){Treset();document.exitPointerLock&&document.exitPointerLock();drawInv();}
  drawBar();};
ivp.onclick=e=>{if(e.target==ivp)tog(0);};            // tap the dim area to close
bi.onclick=()=>tog(!invOpen);
bi.ontouchstart=e=>{e.preventDefault();e.stopPropagation();tog(!invOpen);};

// ---- slot picking (bottom bar) ----
sfrom=e=>(n3=e.target.closest&&e.target.closest('.slot'))?+n3.dataset.i:-1;
bar.onclick=e=>{sj=sfrom(e);if(sj>=0)selBlock(sj);};
bar.ontouchstart=e=>{sj=sfrom(e);if(sj>=0){e.preventDefault();e.stopPropagation();selBlock(sj);}};

// ---- drag & drop inside the bag (pointer events = mouse + touch) ----
gmove=e=>{gh.style.left=(e.clientX-23)+'px';gh.style.top=(e.clientY-23)+'px';};
ig.onpointerdown=e=>{
  sj=sfrom(e);if(sj<0||!INV[sj].id)return;
  e.preventDefault();dragI=sj;
  gh.style.background=BC[INV[sj].id];gh.style.display='block';gmove(e);
  ig.setPointerCapture&&ig.setPointerCapture(e.pointerId);drawInv();
};
ig.onpointermove=e=>{if(dragI>=0)gmove(e);};
ig.onpointercancel=()=>{dragI=-1;gh.style.display='none';drawInv();};
ig.onpointerup=e=>{
  if(dragI<0)return;
  gh.style.display='none';
  n4=document.elementFromPoint(e.clientX,e.clientY);
  n4=n4&&n4.closest&&n4.closest('.slot');
  if(n4&&(dj=+n4.dataset.i)!=dragI){
    a3=INV[dragI];b3=INV[dj];
    if(a3.id&&a3.id==b3.id&&b3.n<64){                 // same block -> merge stacks
      kk=mn(64-b3.n,a3.n);b3.n+=kk;a3.n-=kk;if(!a3.n)INV[dragI]={id:0,n:0};
    }else{INV[dragI]=b3;INV[dj]=a3;}                  // otherwise swap
  }
  dragI=-1;drawInv();drawBar();
};
drawBar();
onwheel=e=>{e.preventDefault();selBlock((selI+(e.deltaY>0?1:5))%6);};
for(i=200;i--;)PT.push({x:M.random()*W,y:M.random()*H,ph:M.random()*6.28}); // rain/snow

onkeydown=e=>{K[e.key.toLowerCase()]=1;if(e.key==' ')e.preventDefault();if(e.key>='1'&&e.key<='6')selBlock(+e.key-1);
  if(e.key=='i'||e.key=='Tab'){e.preventDefault();tog(!invOpen);}
  if(e.key=='Escape'&&invOpen)tog(0);
  if(e.key=='c'){CRE^=1;drawBar();if(invOpen)drawInv();}      // survival <-> creative
  if(e.key=='g')SHD^=1;
  if(e.key=='r')wthr=(wthr+1)%3;
  if(e.key=='x'){GEN();LGT();KIT();drawBar();if(invOpen)drawInv();P.x=16;P.y=30;P.z=16;P.g=0;
    try{localStorage.removeItem('voxelW');localStorage.removeItem('voxelP');localStorage.removeItem('voxelI');}catch(e){}}
};
onkeyup=e=>K[e.key.toLowerCase()]=0;
c.oncontextmenu=e=>e.preventDefault();
c.onmousedown=e=>{
  if(document.pointerLockElement==c){e.button==2?place():dig();}
  else{drag=1;c.requestPointerLock&&c.requestPointerLock();}
};
onmouseup=()=>drag=0;
onmousemove=e=>{
  if(document.pointerLockElement==c||drag){
    P.a+=e.movementX*.003;
    P.b=mx(-1.5,mn(1.5,P.b-e.movementY*.003));
  }
};

// ---- main loop ----
(L=tm=>{
  dt=mn((tm-P.t||0)/1e3,.1);P.t=tm;
  mu=mvu;mv=mvv;
  if(K.w)mv=1;if(K.s)mv=-1;if(K.a)mu=-1;if(K.d)mu=1;
  kj=K[' ']||jmp?1:0;jmp=0;
  if(invOpen){mu=mv=0;kj=0;lkx=lky=0;}              // bag open = hands off the world
  mu=mx(-1,mn(1,mu));mv=mx(-1,mn(1,mv));
  J=mx(0,J-dt);
  dc=mx(0,dc-dt);
  if((K.f||K.e)&&dc==0&&!invOpen){K.f?dig():place();dc=.15;}
  if(kj&&P.g==0&&J==0){P.g=8;J=.35;}
  sp=5*dt;
  P.g-=18*dt;
  P.a+=lkx*LKS;                                     // drag right = turn right
  P.b=mx(-1.5,mn(1.5,P.b-lky*LKS));                 // drag down = look down (matches the mouse)
  lkx=lky=0;
  cx=C(P.a);sx=S(P.a);
  vx=(mu*cx+mv*sx)*sp;
  vz=(-mu*sx+mv*cx)*sp;
  P.x+=vx;U(0,vx);
  P.z+=vz;U(2,vz);
  P.y+=P.g*dt;U(1,P.g);
  if(P.y<-10){P.x=16;P.y=30;P.z=16;P.g=0;}
  // ---- day / night cycle ----
  tod=(tod+dt/1440*(K.t?100:1))%1;                   // full day = 24 min (hold T = 100x preview)
  sunA=(tod-.25)*6.2832;sunEl=S(sunA);               // sun elevation -1..1
  sdx=C(sunA);sdy=sunEl;sdz=.15;sl=M.sqrt(sdx*sdx+sdy*sdy+sdz*sdz);
  sdx/=sl;sdy/=sl;sdz/=sl;                            // normalized sun direction
  light=mx(.22,mn(1,sunEl*1.4+.5));                   // ambient brightness
  dayf=mx(0,mn(1,sunEl*1.6+.5));
  zR=8+62*dayf;zG=12+128*dayf;zB=35+200*dayf;         // zenith colour
  hR=22+150*dayf;hG=32+170*dayf;hB=58+190*dayf;       // horizon colour
  tw=mx(0,1-A(sunEl)*3);                              // twilight (near horizon crossing)
  hR+=(250-hR)*tw*.8;hG+=(145-hG)*tw*.8;hB+=(88-hB)*tw*.8;
  flk=.86+.09*S(tm*.011)+.05*S(tm*.027);             // torch flicker
  wt+=dt*.35;                                        // cloud drift
  oc=wthr?.72:1;light*=oc;                           // overcast dims everything
  zR*=oc;zG*=oc;zB*=oc;hR*=oc;hG*=oc;hB*=oc;
  ct=wthr?-.1:.42;                                   // cloud threshold (lower = more cloud)
  cbr=(wthr?140:70)+(wthr?70:180)*dayf;              // cloud brightness
  cp=C(P.b);sp=S(P.b);
  if(SHD)SC.fill(-1);                                 // reset per-face shadow cache for this frame
  for(k=W*H;k--;){
    x=k%W;y=k/W|0;
    dx=x/hw-1;dy=.6-y/hw;
    d={x:sx*cp+cx*dx-sx*sp*dy,y:sp+cp*dy,z:cx*cp-sx*dx-cx*sp*dy};
    h=R({x:P.x,y:P.y+1.5,z:P.z},d);
    if(h.h){
      Q=[0,16046206,7360560,4206624,2121760,0,0xFFC24A][h.b];
      h.n==0?(nrx=-q,nry=0,nrz=0):h.n==1?(nrx=0,nry=-r,nrz=0):(nrx=0,nry=0,nrz=-s); // face normal
      if(h.b==6){                                      // torch itself: emissive, never dark
        m=1.18*flk;cr=(Q>>16)*m;cg=((Q>>8)&255)*m;cb=(Q&255)*m;
      }else{
      diff=mx(0,nrx*sdx+nry*sdy+nrz*sdz);             // how much the face faces the sun
      if(SHD&&dayf>.02&&diff>0){                       // shadow (cached per block-face)
        fi=I(X,Y,Z)*6+h.n*2+(nrx+nry+nrz>0?1:0);
        sc=SC[fi];if(sc<0)sc=SC[fi]=SH(X+.5+nrx,Y+.5+nry,Z+.5+nrz);
        if(sc)diff=0;
      }
      m=light*(.6+.22*mx(0,nry))+diff*dayf*.8;        // sky ambient (top-lit) + sun
      cr=(Q>>16)*m;cg=((Q>>8)&255)*m;cb=(Q&255)*m;
      tl=LV(X+nrx,Y+nry,Z+nrz)/14;                    // torch light landing on this face
      if(tl){tl=tl*tl*flk;cr+=(Q>>16)*tl*1.3;cg+=((Q>>8)&255)*tl*.82;cb+=(Q&255)*tl*.42;}
      }
    }else{                                            // ---- sky ----
      rx=d.x;ry=d.y;rz=d.z;rl=M.sqrt(rx*rx+ry*ry+rz*rz);
      up=mx(0,mn(1,ry/rl*1.6+.25));
      cr=hR+(zR-hR)*up;cg=hG+(zG-hG)*up;cb=hB+(zB-hB)*up;
      dts=(rx*sdx+ry*sdy+rz*sdz)/rl;                  // cos(angle to sun)
      if(sunEl>-.06&&dts>.9965){cr=255;cg=250;cb=225;}          // sun disk
      else if(sunEl>-.06&&dts>.9){gl=(dts-.9)/.1;gl*=gl;cr+=(255-cr)*gl*.5;cg+=(238-cg)*gl*.5;cb+=(180-cb)*gl*.4;} // sun glow
      else if(sunEl<.12&&-dts>.9975){cr=235;cg=240;cb=250;}     // moon disk
      if(sunEl<.06){                                             // ---- stars ----
        nf=mx(0,mn(1,-sunEl*4));snx=rx/rl;sny=ry/rl;snz=rz/rl;
        if(sny>.03){
          qx=snx*92|0;qy=sny*92|0;qz=snz*92|0;
          hs=(qx*1836311903^qy*2109839^qz*971)&2047;
          if(hs<3){tk=.6+.4*S(hs*3+tod*60);st=210*nf*tk;cr+=st;cg+=st;cb+=st+8;}
        }
      }
      if(ry>.05){                                                // ---- clouds ----
        cfx=P.x+rx/ry*20;cfz=P.z+rz/ry*20;                       // project onto cloud plane
        nv=S(cfx*.15+wt)*C(cfz*.13-wt*.5);
        cov=mx(0,mn(1,(nv-ct)*2))*mx(0,mn(1,(ry-.05)*5));
        cr+=(cbr-cr)*cov;cg+=(cbr-cg)*cov;cb+=(cbr+6-cb)*cov;
      }
    }
    if(h.gc){                                         // glass tint toward sky
      aG=mn(.6,h.gc*.24);
      cr+=(hR-cr)*aG;cg+=(hG-cg)*aG;cb+=(hB-cb)*aG;
    }
    cr=cr>255?255:cr;cg=cg>255?255:cg;cb=cb>255?255:cb;
    D[k]=0xFF000000|(cb&255)<<16|(cg&255)<<8|cr&255;
  }
  T.putImageData(N,0,0);
  // ---- highlight the face the crosshair points at ----
  TG=target();
  if(TG&&(TG[0]-TG[3]|TG[1]-TG[4]|TG[2]-TG[5])){
    gx=TG[0];gy=TG[1];gz=TG[2];
    dfx=gx-TG[3];dfy=gy-TG[4];dfz=gz-TG[5];
    C4=dfx?[[gx+(dfx<0),gy,gz],[gx+(dfx<0),gy+1,gz],[gx+(dfx<0),gy+1,gz+1],[gx+(dfx<0),gy,gz+1]]
      :dfy?[[gx,gy+(dfy<0),gz],[gx+1,gy+(dfy<0),gz],[gx+1,gy+(dfy<0),gz+1],[gx,gy+(dfy<0),gz+1]]
      :[[gx,gy,gz+(dfz<0)],[gx+1,gy,gz+(dfz<0)],[gx+1,gy+1,gz+(dfz<0)],[gx,gy+1,gz+(dfz<0)]];
    bad=0;T.beginPath();
    for(m=0;m<4;m++){p=PR(C4[m][0],C4[m][1],C4[m][2]);if(!p){bad=1;break;}m?T.lineTo(p[0],p[1]):T.moveTo(p[0],p[1]);}
    if(!bad){T.closePath();T.lineWidth=1.5;T.strokeStyle='rgba(0,0,0,.7)';T.stroke();T.lineWidth=.8;T.strokeStyle='#fff';T.stroke();}
  }
  // ---- precipitation overlay ----
  if(wthr){
    if(wthr==1){T.strokeStyle='rgba(190,215,255,.5)';T.lineWidth=1;T.beginPath();}
    else T.fillStyle='rgba(255,255,255,.9)';
    for(pt of PT){
      if(wthr==1){pt.y+=420*dt;pt.x+=45*dt;}else{pt.y+=72*dt;pt.x+=S(pt.y*.05+pt.ph)*22*dt+9*dt;}
      if(pt.y>H+2){pt.y=-4;pt.x=M.random()*W;}
      if(pt.x>W+2)pt.x-=W+6;
      if(wthr==1){T.moveTo(pt.x,pt.y);T.lineTo(pt.x-5,pt.y-11);}else T.fillRect(pt.x,pt.y,1.6,1.6);
    }
    if(wthr==1)T.stroke();
  }
  // ---- autosave (silently skipped in sandboxed previews) ----
  sv-=dt;
  if(sv<=0){sv=8;try{ss='';for(i=0;i<32768;i++)ss+=String.fromCharCode(w[i]);
    localStorage.voxelW=btoa(ss);localStorage.voxelP=JSON.stringify({x:P.x,y:P.y,z:P.z,a:P.a,b:P.b,g:0});
    localStorage.voxelT=tod;localStorage.voxelI=JSON.stringify(INV);}catch(e){}}
  hh=tod*24|0;mm=(tod*24-hh)*60|0;
  clk.textContent=(sunEl>.12?'☀':sunEl<-.12?'🌙':'🌆')+(wthr==1?'🌧':wthr==2?'❄':'')+' '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+(CRE?' ∞':'');
  requestAnimationFrame(L);
})(0);
</script>
